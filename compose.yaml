services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildrule_gujarat
      POSTGRES_USER: buildrule
      POSTGRES_PASSWORD: buildrule_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buildrule-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildrule -d buildrule_gujarat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buildrule-postgres:
